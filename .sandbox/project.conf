# .sandbox/project.conf — next
PROJECT_NAME=next

# Build system (make or mage)
BUILD_SYSTEM=make

# Single fleet pin for golangci-lint. CI, the Makefile sandbox prebuilds, and
# any future go-sandbox setup all read this key — there is exactly one place
# this version is written (conform lint-pin rule).
GOLANGCI_LINT_VERSION=v2.12.2
